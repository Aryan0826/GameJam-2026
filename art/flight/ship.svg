<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hull Shading Gradients -->
    <linearGradient id="hullUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0bcc9" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="hullLower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="prowTip" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Conqueror Crimson War Stripes -->
    <linearGradient id="crimsonUpper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="40%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="crimsonLower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Superstructure Deck Gradients -->
    <linearGradient id="deckUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="deckLower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glowing Blue Hangar Bays -->
    <linearGradient id="bayGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. ENGINE NOZZLE HARDWARE (UNLIT AT IDLE) ==================== -->
  <g id="engine-bells">
    <!-- Auxiliary Outer Nozzles -->
    <polygon points="44,128 66,124 66,156 44,152" fill="#1e293b" stroke="#090d16" stroke-width="2" />
    <rect x="40" y="132" width="6" height="16" rx="1" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <ellipse cx="45" cy="140" rx="2" ry="5" fill="#334155" />

    <polygon points="44,356 66,352 66,384 44,380" fill="#1e293b" stroke="#090d16" stroke-width="2" />
    <rect x="40" y="360" width="6" height="16" rx="1" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <ellipse cx="45" cy="372" rx="2" ry="5" fill="#334155" />

    <!-- Port & Starboard Colossal Main Engine Bells -->
    <polygon points="36,164 70,158 70,210 36,204" fill="#334155" stroke="#090d16" stroke-width="2.5" />
    <rect x="30" y="168" width="8" height="32" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <line x1="42" y1="176" x2="64" y2="176" stroke="#0f172a" stroke-width="2" />
    <line x1="42" y1="184" x2="64" y2="184" stroke="#0f172a" stroke-width="2" />
    <line x1="42" y1="192" x2="64" y2="192" stroke="#0f172a" stroke-width="2" />
    <ellipse cx="37" cy="184" rx="3" ry="9" fill="#1e293b" />

    <polygon points="36,302 70,296 70,348 36,342" fill="#334155" stroke="#090d16" stroke-width="2.5" />
    <rect x="30" y="306" width="8" height="32" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <line x1="42" y1="314" x2="64" y2="314" stroke="#0f172a" stroke-width="2" />
    <line x1="42" y1="322" x2="64" y2="322" stroke="#0f172a" stroke-width="2" />
    <line x1="42" y1="330" x2="64" y2="330" stroke="#0f172a" stroke-width="2" />
    <ellipse cx="37" cy="328" rx="3" ry="9" fill="#1e293b" />

    <!-- Center Heavy Flagship Engine Bell -->
    <polygon points="32,230 68,222 68,290 32,282" fill="#334155" stroke="#090d16" stroke-width="2.5" />
    <rect x="26" y="236" width="8" height="40" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <line x1="38" y1="246" x2="62" y2="246" stroke="#0f172a" stroke-width="2" />
    <line x1="38" y1="256" x2="62" y2="256" stroke="#0f172a" stroke-width="2" />
    <line x1="38" y1="266" x2="62" y2="266" stroke="#0f172a" stroke-width="2" />
    <ellipse cx="33" cy="256" rx="3.5" ry="13" fill="#1e293b" />
  </g>

  <!-- ==================== 2. UNDERCARRIAGE & LATERAL TRENCH ==================== -->
  <g id="lateral-trench">
    <!-- Stern Transom / Engine Mounting Wall -->
    <polygon points="58,116 74,110 74,402 58,396" fill="#090d16" stroke="#000000" stroke-width="2.5" />
    
    <!-- Deep Recessed Lateral Machinery Trench -->
    <polygon points="58,116 96,60 252,132 246,142 500,256 246,370 252,380 96,452 58,396" fill="#090d16" stroke="#1e293b" stroke-width="2.5" />
    
    <!-- Trench Mechanical High-Contrast Detailing -->
    <line x1="96" y1="62" x2="484" y2="252" stroke="#475569" stroke-width="2" />
    <line x1="96" y1="450" x2="484" y2="260" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- ==================== 3. MAIN WEDGE ARMORED HULL ==================== -->
  <g id="main-hull">
    <!-- Port / Upper Hull Wedge -->
    <polygon points="66,120 98,66 252,136 246,146 496,256 66,256" fill="url(#hullUpper)" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Starboard / Lower Hull Wedge (Deep Shadow) -->
    <polygon points="66,256 496,256 246,366 252,376 98,446 66,392" fill="url(#hullLower)" stroke="#0f172a" stroke-width="2.5" />

    <!-- Bold Armor Plating Seams (Port Deck) -->
    <line x1="146" y1="92" x2="122" y2="154" stroke="#475569" stroke-width="2" />
    <line x1="216" y1="122" x2="188" y2="182" stroke="#475569" stroke-width="2" />
    <line x1="304" y1="168" x2="278" y2="214" stroke="#475569" stroke-width="2" />
    <line x1="384" y1="204" x2="364" y2="238" stroke="#475569" stroke-width="2" />
    <line x1="446" y1="234" x2="432" y2="252" stroke="#475569" stroke-width="2" />

    <!-- Bold Armor Plating Seams (Starboard Deck) -->
    <line x1="146" y1="420" x2="122" y2="358" stroke="#1e293b" stroke-width="2" />
    <line x1="216" y1="390" x2="188" y2="330" stroke="#1e293b" stroke-width="2" />
    <line x1="304" y1="344" x2="278" y2="298" stroke="#1e293b" stroke-width="2" />
    <line x1="384" y1="308" x2="364" y2="274" stroke="#1e293b" stroke-width="2" />
    <line x1="446" y1="278" x2="432" y2="260" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- ==================== 4. CONQUEROR CRIMSON WAR STRIPES ==================== -->
  <g id="war-stripes">
    <!-- Prow Chevron Border -->
    <polygon points="496,256 422,220 414,228 480,256 414,284 422,292" fill="url(#crimsonUpper)" stroke="#450a0a" stroke-width="1.5" />
    
    <!-- Forward Deck Chevrons -->
    <polygon points="412,222 372,204 366,212 402,228 366,244 372,252 412,234" fill="url(#crimsonUpper)" />
    <polygon points="412,290 372,308 366,300 402,284 366,268 372,260 412,278" fill="url(#crimsonLower)" />

    <!-- Rear Wing Radiator Armor Stripes (Port Side) -->
    <polygon points="106,126 128,116 138,132 116,142" fill="url(#crimsonUpper)" stroke="#450a0a" stroke-width="1" />
    <polygon points="126,140 148,130 158,146 136,156" fill="url(#crimsonUpper)" stroke="#450a0a" stroke-width="1" />
    <polygon points="146,154 168,144 178,160 156,170" fill="url(#crimsonUpper)" stroke="#450a0a" stroke-width="1" />
    <polygon points="166,168 188,158 198,174 176,184" fill="url(#crimsonUpper)" stroke="#450a0a" stroke-width="1" />

    <!-- Rear Wing Radiator Armor Stripes (Starboard Side) -->
    <polygon points="106,386 128,396 138,380 116,370" fill="url(#crimsonLower)" stroke="#200508" stroke-width="1" />
    <polygon points="126,372 148,382 158,366 136,356" fill="url(#crimsonLower)" stroke="#200508" stroke-width="1" />
    <polygon points="146,358 168,368 178,352 156,342" fill="url(#crimsonLower)" stroke="#200508" stroke-width="1" />
    <polygon points="166,344 188,354 198,338 176,328" fill="url(#crimsonLower)" stroke="#200508" stroke-width="1" />
    
    <!-- Mid-Deck Longitudinal War Lines -->
    <polygon points="174,190 316,226 316,232 174,196" fill="url(#crimsonUpper)" />
    <polygon points="174,322 316,286 316,280 174,316" fill="url(#crimsonLower)" />
  </g>

  <!-- ==================== 5. GLOWING ICE-BLUE HANGARS / SHIELD BAYS ==================== -->
  <g id="hangar-bays">
    <!-- Port Hangar Bay -->
    <polygon points="246,170 302,192 292,206 236,184" fill="#090d16" stroke="#0284c7" stroke-width="2.5" />
    <polygon points="248,172 300,193 290,204 238,183" fill="url(#bayGlow)" />
    <line x1="274" y1="183" x2="264" y2="195" stroke="#ffffff" stroke-width="2" />

    <!-- Starboard Hangar Bay -->
    <polygon points="246,342 302,320 292,306 236,328" fill="#090d16" stroke="#0284c7" stroke-width="2.5" />
    <polygon points="248,340 300,319 290,308 238,329" fill="url(#bayGlow)" />
    <line x1="274" y1="329" x2="264" y2="317" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- ==================== 6. SUPERSTRUCTURE TIER 1 (LOWER CITADEL) ==================== -->
  <g id="citadel-tier1">
    <polygon points="82,140 112,110 392,238 392,256 82,256" fill="url(#deckUpper)" stroke="#1e293b" stroke-width="2" />
    <polygon points="82,256 392,256 392,274 112,402 82,372" fill="url(#deckLower)" stroke="#1e293b" stroke-width="2" />

    <!-- Forward Nose Spearhead Inset -->
    <polygon points="360,240 462,256 360,272" fill="url(#prowTip)" stroke="#1e293b" stroke-width="2" />
    <line x1="360" y1="256" x2="460" y2="256" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- ==================== 7. SUPERSTRUCTURE TIER 2 (MID DECK) ==================== -->
  <g id="citadel-tier2">
    <polygon points="92,166 122,142 318,240 318,256 92,256" fill="url(#deckUpper)" stroke="#1e293b" stroke-width="2" />
    <polygon points="92,256 318,256 318,272 122,370 92,346" fill="url(#deckLower)" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- ==================== 8. FORWARD DUAL TURRETS ==================== -->
  <g id="forward-turrets" fill="#1e293b" stroke="#090d16" stroke-width="1.5">
    <!-- Forward Deck Turret 1 (Port) -->
    <circle cx="338" cy="235" r="5.5" fill="#475569" />
    <rect x="338" y="232" width="10" height="2" fill="#090d16" />
    <rect x="338" y="236" width="10" height="2" fill="#090d16" />

    <!-- Forward Deck Turret 2 (Starboard) -->
    <circle cx="338" cy="277" r="5.5" fill="#334155" />
    <rect x="338" y="274" width="10" height="2" fill="#090d16" />
    <rect x="338" y="278" width="10" height="2" fill="#090d16" />

    <!-- Forward Deck Turret 3 (Port Inner) -->
    <circle cx="364" cy="245" r="4.5" fill="#475569" />
    <rect x="364" y="243" width="8" height="1.8" fill="#090d16" />
    <rect x="364" y="246" width="8" height="1.8" fill="#090d16" />

    <!-- Forward Deck Turret 4 (Starboard Inner) -->
    <circle cx="364" cy="267" r="4.5" fill="#334155" />
    <rect x="364" y="265" width="8" height="1.8" fill="#090d16" />
    <rect x="364" y="268" width="8" height="1.8" fill="#090d16" />
  </g>

  <!-- ==================== 9. HEAVY TURBOLASER BATTERIES (TERRACE) ==================== -->
  <g id="heavy-turbolasers" fill="#334155" stroke="#090d16" stroke-width="2">
    <!-- Port Batteries (4 Barbettes) -->
    <circle cx="154" cy="152" r="7.5" /><rect x="154" y="148" width="16" height="3" stroke="none" fill="#090d16" /><rect x="154" y="153" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="194" cy="170" r="7.5" /><rect x="194" y="166" width="16" height="3" stroke="none" fill="#090d16" /><rect x="194" y="171" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="234" cy="188" r="7.5" /><rect x="234" y="184" width="16" height="3" stroke="none" fill="#090d16" /><rect x="234" y="189" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="274" cy="206" r="7.5" /><rect x="274" y="202" width="16" height="3" stroke="none" fill="#090d16" /><rect x="274" y="207" width="16" height="3" stroke="none" fill="#090d16" />

    <!-- Starboard Batteries (4 Barbettes) -->
    <circle cx="154" cy="360" r="7.5" /><rect x="154" y="356" width="16" height="3" stroke="none" fill="#090d16" /><rect x="154" y="361" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="194" cy="342" r="7.5" /><rect x="194" y="338" width="16" height="3" stroke="none" fill="#090d16" /><rect x="194" y="343" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="234" cy="324" r="7.5" /><rect x="234" y="320" width="16" height="3" stroke="none" fill="#090d16" /><rect x="234" y="325" width="16" height="3" stroke="none" fill="#090d16" />
    <circle cx="274" cy="306" r="7.5" /><rect x="274" y="302" width="16" height="3" stroke="none" fill="#090d16" /><rect x="274" y="307" width="16" height="3" stroke="none" fill="#090d16" />
  </g>

  <!-- ==================== 10. COMMAND BRIDGE CITADEL (TIER 3) ==================== -->
  <g id="command-citadel">
    <!-- Upper Terrace -->
    <polygon points="102,186 132,172 240,242 240,270 132,340 102,326" fill="url(#deckUpper)" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Central Heavy Armor Spine / Ridge -->
    <polygon points="84,251 250,251 250,261 84,261" fill="#475569" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Heavy Dorsal Cannon / Spine Structure -->
    <rect x="138" y="252" width="74" height="8" rx="2" fill="#090d16" stroke="#475569" stroke-width="1.5" />
    <polygon points="212,249 232,256 212,263" fill="#334155" />

    <!-- Command Bridge Tower Base Neck -->
    <polygon points="86,210 122,220 122,292 86,302" fill="#475569" stroke="#090d16" stroke-width="2.5" />

    <!-- Main Bridge Tower Face -->
    <polygon points="94,170 134,180 134,332 94,342" fill="#cbd5e1" stroke="#090d16" stroke-width="2.5" />
    
    <!-- Armored Command Block -->
    <rect x="106" y="232" width="24" height="48" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Sinister Observation Slit / Bridge Visor (Glowing Evil Crimson) -->
    <rect x="126" y="238" width="5" height="36" rx="1.5" fill="#ff0033" />
    <rect x="127.5" y="242" width="2" height="28" rx="1" fill="#ffe4e6" />

    <!-- Port Deflector Shield Generator Dome -->
    <circle cx="112" cy="190" r="13" fill="#ffffff" stroke="#090d16" stroke-width="2.5" />
    <circle cx="112" cy="190" r="7" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="99" y1="190" x2="125" y2="190" stroke="#0f172a" stroke-width="2" />
    <line x1="112" y1="177" x2="112" y2="203" stroke="#0f172a" stroke-width="2" />

    <!-- Starboard Deflector Shield Generator Dome -->
    <circle cx="112" cy="322" r="13" fill="#cbd5e1" stroke="#090d16" stroke-width="2.5" />
    <circle cx="112" cy="322" r="7" fill="none" stroke="#475569" stroke-width="2" />
    <line x1="99" y1="322" x2="125" y2="322" stroke="#0f172a" stroke-width="2" />
    <line x1="112" y1="309" x2="112" y2="335" stroke="#0f172a" stroke-width="2" />

    <!-- Bridge Sensor Array / Communications Spire -->
    <line x1="130" y1="208" x2="144" y2="208" stroke="#090d16" stroke-width="2.5" />
    <line x1="130" y1="304" x2="144" y2="304" stroke="#090d16" stroke-width="2.5" />
    <circle cx="144" cy="208" r="2.5" fill="#38bdf8" />
    <circle cx="144" cy="304" r="2.5" fill="#38bdf8" />
  </g>
</svg>